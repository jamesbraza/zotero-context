[tool.codespell]
check-filenames = true
check-hidden = true
ignore-words-list = "fith"  # PDF destination type FitH (fit horizontal)
skip = [
  "./.scaffold/build/*",  # Generated by `npm run build`, bundles third-party dependency code
  ".gitignore",  # Generated by curl of github/gitignore repo's templates
  "node_modules",  # npm-installed third-party dependencies
  "package-lock.json",  # Generated by `npm install` to pin the dependency tree
]

[tool.markdown_toc_creator]
horizontal-rule-style = "prettier"
proactive = false

[tool.pymarkdown]
extensions.front-matter.enabled = true
plugins.line-length.code_block_line_length = 88
plugins.line-length.enabled = true
plugins.line-length.line_length = 120
plugins.line-length.stern = true
plugins.line-length.tables = false
plugins.no-duplicate-heading.siblings_only = true  # GitHub appends -X for duplicated headings
plugins.no-emphasis-as-heading.enabled = false
plugins.no-inline-html.enabled = false

[tool.tomlsort]
all = true
in_place = true
spaces_before_inline_comment = 2  # Match Python PEP 8
spaces_indent_inline_array = 2  # Match prettier tabWidth
trailing_comma_inline_array = true
