name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@v1.1.0
      - uses: j178/prek-action@v2

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@v1.1.0
      - name: Run Build
        run: npm run build
      # typings/ is committed so typecheck works without a build (editors,
      # the pre-commit job); fail if a build no longer reproduces it
      - name: Check committed typings are current
        # intent-to-add so newly generated (untracked) files also fail the diff
        run: git add --intent-to-add typings/ && git diff --exit-code typings/
      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: build-result
          path: .scaffold/build

  test:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@v1.1.0
      # Scaffold caches chai.js here; a warm cache also silences its
      # cold-start "No local chai.js found" notice
      - name: Cache scaffold test libraries
        uses: actions/cache@v6
        with:
          path: .scaffold/cache
          key: scaffold-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: scaffold-cache-
      - name: Resolve Zotero release version
        id: zotero
        run: |
          url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' 'https://www.zotero.org/download/client/dl?platform=linux-x86_64&channel=release')
          version=$(basename "$(dirname "$url")")
          # A wrong-but-constant version would silently pin a stale cached
          # Zotero via the download-skip guard below — fail loudly instead
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "unexpected download URL: $url" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Zotero
        uses: actions/cache@v6
        with:
          path: zotero.tar.xz
          key: zotero-linux-x86_64-release-${{ steps.zotero.outputs.version }}
      # Pin the release channel: zotero-plugin-scaffold otherwise downloads
      # the beta, whose reader internals differ from the supported target
      # (10.0-beta already replaced the segment machinery — see openspec
      # backlog on the SDT port)
      - name: Install Zotero (release channel)
        run: |
          [ -s zotero.tar.xz ] || wget -qO zotero.tar.xz 'https://www.zotero.org/download/client/dl?platform=linux-x86_64&channel=release'
          tar -xf zotero.tar.xz
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$PWD/Zotero_linux-x86_64/zotero" >> "$GITHUB_ENV"
      # Pre-install what zotero-plugin-scaffold's prepareHeadless would
      # otherwise apt-install silently: its Xvfb launch waits only 2 s for
      # the display, and on a slow runner the hidden apt phase pushes Xvfb
      # past that window ("Could not start Xvfb", seen on run 30116604660).
      # https://github.com/northword/zotero-plugin-scaffold/blob/v0.8.7/src/core/tester/headless.ts#L8-L19
      # (package list at L67; v0.8.7 matches package-lock.json)
      - name: Pre-install headless display packages
        run: sudo apt-get install -y xvfb x11-xkb-utils xkb-data
      - run: npm run test
