name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@v1.0.0
      - uses: j178/prek-action@v2

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@v1.0.0
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: build-result
          path: .scaffold/build

  test:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@v1.0.0
      # Pin the release channel: zotero-plugin-scaffold otherwise downloads
      # the beta, whose reader internals differ from the supported target
      # (10.0-beta already replaced the segment machinery — see openspec
      # backlog on the SDT port)
      - name: Install Zotero (release channel)
        run: |
          wget -qO zotero.tar.xz 'https://www.zotero.org/download/client/dl?platform=linux-x86_64&channel=release'
          tar -xf zotero.tar.xz
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$PWD/Zotero_linux-x86_64/zotero" >> "$GITHUB_ENV"
      - run: npm run test
