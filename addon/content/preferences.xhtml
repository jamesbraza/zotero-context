<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-enable"
    preference="enable"
    data-l10n-id="pref-enable"
  />
  <checkbox
    id="zotero-prefpane-__addonRef__-warm-on-open"
    preference="warmOnOpen"
    data-l10n-id="pref-warm-on-open"
  />
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="pref-mcp-title"></html:h2></label>
  <description data-l10n-id="pref-mcp-description"></description>
  <checkbox
    id="zotero-prefpane-__addonRef__-mcp-enabled"
    preference="mcpEnabled"
    data-l10n-id="pref-mcp-enable"
  />
  <hbox align="center">
    <label data-l10n-id="pref-mcp-port"></label>
    <html:input
      type="number"
      id="zotero-prefpane-__addonRef__-mcp-port"
      preference="mcpPort"
      min="1024"
      max="65535"
    />
  </hbox>
  <hbox align="center">
    <label data-l10n-id="pref-mcp-status"></label>
    <label id="zotero-prefpane-__addonRef__-mcp-status-value"></label>
  </hbox>
  <!-- Wired in preferences.js through the guarded plugin-api lookup -->
  <hbox>
    <button
      id="zotero-prefpane-__addonRef__-mcp-copy-claude-code"
      data-l10n-id="pref-mcp-copy-claude-code"
    />
    <button
      id="zotero-prefpane-__addonRef__-mcp-copy-config"
      data-l10n-id="pref-mcp-copy-config"
    />
    <button
      id="zotero-prefpane-__addonRef__-mcp-copy-token"
      data-l10n-id="pref-mcp-copy-token"
    />
  </hbox>
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="pref-chat-links-title"></html:h2></label>
  <label data-l10n-id="pref-preferred-chat"></label>
  <radiogroup
    id="zotero-prefpane-__addonRef__-preferred-chat"
    preference="preferredChat"
  >
    <radio value="ask" data-l10n-id="pref-preferred-chat-ask" />
    <radio value="claude-code" data-l10n-id="pref-preferred-chat-claude-code" />
    <radio
      value="claude-desktop"
      data-l10n-id="pref-preferred-chat-claude-desktop"
    />
    <radio
      value="claude-browser"
      data-l10n-id="pref-preferred-chat-claude-browser"
    />
    <radio
      value="claude-zotero"
      data-l10n-id="pref-preferred-chat-claude-zotero"
    />
  </radiogroup>
  <hbox align="center">
    <label data-l10n-id="pref-chat-project"></label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-chat-project"
      preference="chatProject"
      placeholder="https://claude.ai/project/…"
      style="flex: 1"
    />
  </hbox>
  <checkbox
    id="zotero-prefpane-__addonRef__-link-chats-on-intro"
    preference="linkChatsOnIntro"
    data-l10n-id="pref-link-chats-on-intro"
  />
  <checkbox
    id="zotero-prefpane-__addonRef__-link-chats-in-groups"
    preference="linkChatsInGroups"
    data-l10n-id="pref-link-chats-in-groups"
  />
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
