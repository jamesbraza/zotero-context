<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 56 56">
  <!-- The grab-mode toolbar button (⌖ position indicator), drawn with
       primitives so it centers identically in every renderer -->
  <rect x="2" y="2" width="52" height="52" rx="10" fill="#2e3440" stroke="#4c566a" stroke-width="2"/>
  <g stroke="#d8dee9" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="28" cy="28" r="9"/>
    <line x1="28" y1="11" x2="28" y2="19"/>
    <line x1="28" y1="37" x2="28" y2="45"/>
    <line x1="11" y1="28" x2="19" y2="28"/>
    <line x1="37" y1="28" x2="45" y2="28"/>
  </g>
</svg>
