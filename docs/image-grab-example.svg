<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" font-family="Georgia, 'Times New Roman', serif">
  <!-- Synthetic example of an image grab: a captured figure region with the
       provenance caption strip the plugin renders along the bottom -->
  <rect x="0" y="0" width="440" height="300" fill="#fdfdfb" stroke="#c8c8c4" stroke-width="1"/>
  <!-- fake plot -->
  <g stroke="#444" stroke-width="1.5" fill="none">
    <line x1="60" y1="40" x2="60" y2="210"/>
    <line x1="60" y1="210" x2="390" y2="210"/>
  </g>
  <polyline points="60,190 110,150 160,155 210,100 260,90 310,60 360,55 390,52"
    fill="none" stroke="#4072e5" stroke-width="2.5"/>
  <polyline points="60,195 110,180 160,170 210,168 260,150 310,148 360,140 390,141"
    fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="30" y="130" font-size="12" fill="#444" transform="rotate(-90 30 130)">BLEU</text>
  <text x="215" y="232" font-size="12" fill="#444" text-anchor="middle">Training steps</text>
  <!-- fake figure caption -->
  <text x="220" y="255" font-size="12.5" fill="#333" text-anchor="middle">
    <tspan font-style="italic">Figure 2.</tspan> Validation performance during training.
  </text>
  <!-- the plugin's provenance caption strip -->
  <rect x="0" y="270" width="440" height="30" fill="#1a1a1a"/>
  <text x="10" y="289" font-size="13" fill="#f5f5f5"
    font-family="-apple-system, 'Segoe UI', Arial, sans-serif">Vaswani et al. 2017 — §Attention, p. 4</text>
</svg>
